<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kugoo V1 BLE Diagnostic</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0d1117;
    color: #e6edf3;
    font-family: Arial, sans-serif;
    padding: 20px;
}

.container {
    max-width: 1000px;
    margin: auto;
}

h1 {
    margin-top: 0;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 12px 16px;
    margin: 4px;
    cursor: pointer;
    background: #238636;
    color: white;
    font-weight: bold;
}

button.secondary {
    background: #30363d;
}

button.danger {
    background: #da3633;
}

input {
    background: #161b22;
    color: white;
    border: 1px solid #30363d;
    border-radius: 7px;
    padding: 11px;
    width: 100%;
    margin: 5px 0;
}

.card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 15px;
    margin-top: 15px;
}

#log {
    background: #05080b;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 12px;
    height: 450px;
    overflow-y: auto;
    font-family: monospace;
    white-space: pre-wrap;
    font-size: 13px;
}

.ok {
    color: #3fb950;
}

.err {
    color: #ff7b72;
}

.info {
    color: #58a6ff;
}

.warn {
    color: #d29922;
}

.char {
    padding: 8px;
    margin: 5px 0;
    background: #0d1117;
    border-radius: 6px;
    font-family: monospace;
}
</style>
</head>

<body>

<div class="container">

<h1>🛴 Kugoo V1 BLE Diagnostic</h1>

<div class="card">

<button onclick="connect()">🔵 Подключиться</button>
<button class="secondary" onclick="disconnect()">Отключиться</button>
<button class="secondary" onclick="clearLog()">Очистить лог</button>

<div id="status">Статус: отключено</div>

</div>


<div class="card">

<h3>BLE-структура</h3>

<div id="services">
Пока устройство не подключено.
</div>

</div>


<div class="card">

<h3>Ручная команда</h3>

<input
    id="command"
    placeholder="Например: CODE=123456"
>

<button onclick="sendCommand()">
Отправить
</button>

<br>

<button
    class="secondary"
    onclick="sendPreset('CODE=000000')">
CODE=000000
</button>

<button
    class="secondary"
    onclick="sendPreset('LKSC+0000')">
LKSC+0000
</button>

</div>


<div class="card">

<h3>Лог</h3>

<div id="log"></div>

</div>

</div>


<script>

let device = null;
let server = null;

let characteristics = [];

let txCharacteristics = [];
let notifyCharacteristics = [];


/* =========================
   LOG
========================= */

function log(text, type = "") {

    const box = document.getElementById("log");

    const time =
        new Date().toLocaleTimeString();

    const line =
        `[${time}] ${text}`;

    const div =
        document.createElement("div");

    div.textContent = line;

    if (type)
        div.className = type;

    box.appendChild(div);

    box.scrollTop = box.scrollHeight;

    console.log(line);
}


function clearLog() {

    document.getElementById("log").innerHTML = "";

}


/* =========================
   HEX
========================= */

function bytesToHex(bytes) {

    return Array.from(bytes)
        .map(b =>
            b.toString(16)
            .padStart(2, "0")
            .toUpperCase()
        )
        .join(" ");

}


function bytesToText(bytes) {

    try {

        return new TextDecoder()
            .decode(bytes)
            .replace(/[^\x20-\x7E\r\n]/g, ".");

    } catch {

        return "";

    }

}


function stringToBytes(str) {

    return new TextEncoder().encode(str);

}


/* =========================
   CONNECT
========================= */

async function connect() {

    try {

        if (!navigator.bluetooth) {

            alert(
                "Web Bluetooth не поддерживается этим браузером."
            );

            return;

        }


        log("Запрашиваем Kugoo V1...", "info");


        device =
            await navigator.bluetooth.requestDevice({

                filters: [
                    {
                        name: "Kugoo V1"
                    }
                ],

                optionalServices: [
                    "b1b99ca0-98e7-11e9-80fe-0002a5d5c51b",
                    "9546bdc0-60ba-11e9-8647-0002a5d5c51b"
                ]

            });


        log(
            `Устройство: ${device.name}`,
            "ok"
        );


        device.addEventListener(
            "gattserverdisconnected",
            onDisconnected
        );


        log("Подключаемся к GATT...", "info");


        server =
            await device.gatt.connect();


        log(
            "GATT подключён.",
            "ok"
        );


        document.getElementById("status")
            .textContent =
            "Статус: подключено";


        await scanServices();


    } catch (error) {

        log(
            "ОШИБКА: " + error,
            "err"
        );

    }

}


/* =========================
   DISCONNECT
========================= */

function disconnect() {

    if (
        device &&
        device.gatt.connected
    ) {

        device.gatt.disconnect();

    }

}


function onDisconnected() {

    log(
        "Устройство отключено.",
        "warn"
    );

    document.getElementById("status")
        .textContent =
        "Статус: отключено";

}


/* =========================
   SERVICE SCAN
========================= */

async function scanServices() {

    characteristics = [];

    txCharacteristics = [];

    notifyCharacteristics = [];


    const container =
        document.getElementById("services");

    container.innerHTML = "";


    log(
        "Получаем список GATT-сервисов...",
        "info"
    );


    const services =
        await server.getPrimaryServices();


    log(
        `Найдено сервисов: ${services.length}`,
        "ok"
    );


    for (const service of services) {

        log(
            `SERVICE: ${service.uuid}`,
            "info"
        );


        const serviceDiv =
            document.createElement("div");

        serviceDiv.className = "card";

        serviceDiv.innerHTML =
            `<b>SERVICE</b><br>${service.uuid}`;


        container.appendChild(serviceDiv);


        let chars;


        try {

            chars =
                await service.getCharacteristics();

        } catch (e) {

            log(
                `Не удалось получить характеристики: ${e}`,
                "err"
            );

            continue;

        }


        log(
            `Характеристик: ${chars.length}`
        );


        for (const characteristic of chars) {

            characteristics.push(
                characteristic
            );


            const props =
                characteristic.properties;


            log(
                `CHAR: ${characteristic.uuid}`,
                "info"
            );


            log(
                `  read=${!!props.read} ` +
                `write=${!!props.write} ` +
                `writeNoResponse=${!!props.writeWithoutResponse} ` +
                `notify=${!!props.notify} ` +
                `indicate=${!!props.indicate}`
            );


            const charDiv =
                document.createElement("div");

            charDiv.className = "char";


            charDiv.innerHTML = `
                <b>${characteristic.uuid}</b><br>
                read: ${!!props.read}
                |
                write: ${!!props.write}
                |
                writeNR: ${!!props.writeWithoutResponse}
                |
                notify: ${!!props.notify}
                |
                indicate: ${!!props.indicate}
            `;


            serviceDiv.appendChild(charDiv);


            /*
             * READ
             */

            if (props.read) {

                try {

                    const value =
                        await characteristic.readValue();

                    const bytes =
                        new Uint8Array(
                            value.buffer
                        );


                    log(
                        `READ ${characteristic.uuid}`,
                        "ok"
                    );

                    log(
                        `  HEX: ${bytesToHex(bytes)}`
                    );

                    log(
                        `  TEXT: ${bytesToText(bytes)}`
                    );

                } catch (e) {

                    log(
                        `READ ERROR ${characteristic.uuid}: ${e}`,
                        "err"
                    );

                }

            }


            /*
             * NOTIFICATIONS
             */

            if (
                props.notify ||
                props.indicate
            ) {

                try {

                    await characteristic
                        .startNotifications();


                    characteristic.addEventListener(
                        "characteristicvaluechanged",
                        handleNotification
                    );


                    notifyCharacteristics
                        .push(characteristic);


                    log(
                        `NOTIFY включён: ${characteristic.uuid}`,
                        "ok"
                    );

                } catch (e) {

                    log(
                        `NOTIFY ERROR ${characteristic.uuid}: ${e}`,
                        "err"
                    );

                }

            }


            /*
             * WRITE
             */

            if (
                props.write ||
                props.writeWithoutResponse
            ) {

                txCharacteristics
                    .push(characteristic);


                log(
                    `WRITE доступен: ${characteristic.uuid}`,
                    "ok"
                );

            }

        }

    }


    log(
        "================================",
        "info"
    );

    log(
        `WRITE characteristics: ${txCharacteristics.length}`,
        "info"
    );

    log(
        `NOTIFY characteristics: ${notifyCharacteristics.length}`,
        "info"
    );

    log(
        "Сканирование завершено.",
        "ok"
    );

}


/* =========================
   NOTIFICATION
========================= */

function handleNotification(event) {

    const value =
        event.target.value;

    const bytes =
        new Uint8Array(
            value.buffer
        );


    log(
        `RX ${event.target.uuid}`,
        "ok"
    );


    log(
        `  HEX: ${bytesToHex(bytes)}`
    );


    log(
        `  TEXT: ${bytesToText(bytes)}`
    );


    /*
     * Известные ответы Kugoo
     */

    const text =
        bytesToText(bytes);


    if (text.includes("CODE_OK")) {

        log(
            ">>> CODE_OK <<<",
            "ok"
        );

    }


    if (text.includes("CODE_NG")) {

        log(
            ">>> CODE_NG <<<",
            "warn"
        );

    }


    if (text.includes("ERROR")) {

        log(
            ">>> ERROR <<<",
            "err"
        );

    }

}


/* =========================
   SEND
========================= */

async function sendPreset(command) {

    document.getElementById("command")
        .value = command;

    await sendCommand();

}


async function sendCommand() {

    const input =
        document.getElementById("command");

    const command =
        input.value.trim();


    if (!command) {

        alert("Введите команду.");

        return;

    }


    if (!txCharacteristics.length) {

        log(
            "Нет WRITE-характеристик.",
            "err"
        );

        return;

    }


    const bytes =
        stringToBytes(command);


    log(
        "================================",
        "info"
    );


    log(
        `TX TEXT: ${command}`,
        "info"
    );


    log(
        `TX HEX: ${bytesToHex(bytes)}`
    );


    /*
     * Используем найденную V1 characteristic,
     * если она присутствует.
     *
     * При нескольких WRITE сначала пробуем
     * characteristic, наиболее похожую на
     * известную b1b99ca1...
     */

    let target =
        txCharacteristics.find(c =>
            c.uuid.toLowerCase()
            .includes("b1b99ca1")
        );


    if (!target)
        target = txCharacteristics[0];


    log(
        `TX UUID: ${target.uuid}`,
        "info"
    );


    try {

        if (
            target.properties
                .writeWithoutResponse
        ) {

            await target
                .writeValueWithoutResponse(bytes);

        } else {

            await target
                .writeValue(bytes);

        }


        log(
            "Команда отправлена.",
            "ok"
        );

    } catch (e) {

        log(
            `TX ERROR: ${e}`,
            "err"
        );

    }

}


/* =========================
   EXPORT LOG
========================= */

function exportLog() {

    const text =
        document.getElementById("log")
        .innerText;


    const blob =
        new Blob(
            [text],
            {
                type: "text/plain"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href = url;
    a.download =
        "kugoo-v1-ble-log.txt";


    a.click();


    URL.revokeObjectURL(url);

}

</script>

</body>
</html>
